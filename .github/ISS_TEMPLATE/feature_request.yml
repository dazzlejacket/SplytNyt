name: Feature request
description: Suggest something SplytNyt should be able to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the feature. What are you working on, and where does the current tool get in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like SplytNyt to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried so far?
      description: Include workarounds, even clumsy ones. They often point at the real shape of the problem.

  - type: dropdown
    id: area
    attributes:
      label: Which part of SplytNyt is this about?
      options:
        - Splitting / detection
        - Track editor
        - Metadata / song identification
        - Theatre mode
        - Export
        - Interface / usability
        - Packaging / installation
        - Something else

  - type: checkboxes
    id: alternatives2
    attributes:
      label: Additional context
      options:
        - label: I am happy to help test a prototype of this.
